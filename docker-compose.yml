version: '3.9'

services:

  postgres:
    image: postgres:16
    container_name: film-postgres
    ports:
      - "5432:5432"
    env_file:
      - ./backend/.env.db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network


  backend:
    build:
      context: ./backend
    image: ghcr.io/juliet-s-p/film-backend:latest
    container_name: film-backend
    env_file:
      - .env
      - ./backend/.env.docker
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
    image: ghcr.io/juliet-s-p/film-frontend:latest
    container_name: film-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app-network
    restart: unless-stopped


  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: film-pgadmin
    env_file:
      - .env
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - app-network


volumes:
  postgres_data:
  pgadmin_data:


networks:
  app-network:
    driver: bridge